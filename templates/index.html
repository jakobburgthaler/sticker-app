<h1>Sticker Manager</h1>

<form action="/add" method="post">
  <input name="stickers" placeholder="z.B. 1,2,3">
  <button>Hinzufügen</button>
</form>

<h3>Reset</h3>
<form action="/reset" method="post">
  <input type="password" name="password" placeholder="Passwort eingeben">
  <button>⚠️ Reset durchführen</button>
</form>

<table border="1">
{% for i in range(0, table|length, 10) %}
<tr>
  {% for j in range(10) %}
    {% if i+j < table|length %}
      <td style="background-color: {{table[i+j].color}}">
        {{table[i+j].num}}<br>
        {{table[i+j].count}}
      </td>
    {% endif %}
  {% endfor %}
</tr>
{% endfor %}
</table>

<form method="get">
  <select name="team">
    <option value="">Alle Teams</option>
    {% for t in teams %}
      <option value="{{t}}" {% if t == selected_team %}selected{% endif %}>{{t}}</option>
    {% endfor %}
  </select>
  <button>Filtern</button>
</form>

<h3>Tausch</h3>
<form action="/trade" method="post">
  Ich gebe ab: <input name="give"><br>
  Ich bekomme: <input name="receive"><br>
  <button>Tauschen</button>
</form>
